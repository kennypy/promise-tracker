#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - python3
  - openssl
  - qemu-guest-agent

write_files:
  - path: /etc/systemd/system/promise-tracker.service
    content: |
      [Unit]
      Description=Promise Tracker
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/promise-tracker/self-host
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Install Docker (official Debian 12 method)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Enable services
  - systemctl enable --now docker
  - systemctl enable --now qemu-guest-agent

  # Clone and deploy Promise Tracker
  - git clone https://github.com/kennypy/promise-tracker.git /opt/promise-tracker
  - cd /opt/promise-tracker/self-host && CLOUD_INIT=1 bash setup.sh
  - cd /opt/promise-tracker/self-host && docker compose up -d

  # Enable auto-start on reboot
  - systemctl enable promise-tracker.service

final_message: |
  =============================================
  Promise Tracker deployment complete!
  Frontend: http://$(hostname -I | awk '{print $1}'):8080
  Studio:   http://$(hostname -I | awk '{print $1}'):3000
  =============================================
